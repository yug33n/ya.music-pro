<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="50%" stop-color="#101018"/>
      <stop offset="100%" stop-color="#08080e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff9900" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="35%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff7b00"/>
    </linearGradient>
    <linearGradient id="proGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8800"/>
      <stop offset="50%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#fff588"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Wave Equalizer Bars -->
  <g fill="url(#goldGrad)">
    <rect x="44" y="96" width="10" height="42" rx="5"/>
    <rect x="62" y="74" width="10" height="86" rx="5"/>
    <rect x="80" y="56" width="10" height="122" rx="5"/>
  </g>

  <!-- Main Audiophile Play Shield -->
  <path d="M 112 60 C 112 52, 120 48, 127 52 L 208 106 C 215 110, 215 120, 208 124 L 127 178 C 120 182, 112 178, 112 170 Z"
        fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Dynamic Wave Cutout / Accent -->
  <path d="M 124 78 L 182 115 L 124 152 Z" fill="#ffffff" opacity="0.3"/>

  <!-- PRO Audiophile Pill Badge -->
  <g transform="translate(128, 208)">
    <rect x="-46" y="-14" width="92" height="26" rx="13" fill="#14141c" stroke="url(#proGrad)" stroke-width="2"/>
    <text x="0" y="5" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-weight="900" font-size="14"
          fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">PRO</text>
  </g>
</svg>
