[package]
name = "ya-music-pro"
version = "0.1.0"
edition = "2021"
authors = ["ya.music-pro contributors"]
description = "Native audiophile Yandex Music desktop client in Rust with Slint"
readme = "README.md"

[dependencies]
# UI Framework
slint = { version = "1.9", default-features = false, features = ["backend-winit", "renderer-skia", "compat-1-2"] }

# Async runtime & networking
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.37", features = ["serialize"] }
md-5 = "0.10"

# Audio & DSP
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.16"
biquad = "0.4"
ringbuf = "0.4"

# Local storage & paths
rusqlite = { version = "0.33", features = ["bundled"] }
directories = "5.0"

# Metadata & audio tags
lofty = "0.21"

# Graphics & Palette
palette = { version = "0.7", features = ["named"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# System integrations
discord-rich-presence = "0.2"
global-hotkey = "0.6"
tray-icon = "0.19"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Threading"
] }

# Utilities
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
slint-build = "1.9"
